# Posts the ZapTap leaderboard to Teams at 16:00 Oslo time on working days.
#
# GitHub schedules run in UTC, so this fires at both 14:00 and 15:00 UTC
# (16:00 Oslo in summer and in winter). The API decides whether it's time:
# it only posts at 16:00 or later Oslo time, skips weekends and Norwegian
# holidays, and never posts twice the same day.
#
# Needs, in the repository settings (Settings > Secrets and variables > Actions):
#   variable ZAPTAP_URL         the site, e.g. https://<name>.azurestaticapps.net
#   secret   ZAPTAP_REPORT_KEY  the same value as ZAPTAP_REPORT_KEY on the Static Web App
name: ZapTap daily results

on:
  schedule:
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Post a test message now (ignores the time, weekends and holidays)"
        type: boolean
        default: true

permissions: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Ask ZapTap to post today's results
        env:
          ZAPTAP_URL: ${{ vars.ZAPTAP_URL }}
          ZAPTAP_REPORT_KEY: ${{ secrets.ZAPTAP_REPORT_KEY }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: |
          if [ -z "$ZAPTAP_URL" ] || [ -z "$ZAPTAP_REPORT_KEY" ]; then
            echo "::error::Set the ZAPTAP_URL variable and the ZAPTAP_REPORT_KEY secret in the repository settings."
            exit 1
          fi
          URL="${ZAPTAP_URL%/}"
          curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 60 \
            -X POST "$URL/api/report" \
            -H "Content-Type: application/json" \
            -H "X-ZapTap-Key: $ZAPTAP_REPORT_KEY" \
            -d "{\"test\": $TEST, \"url\": \"$URL\"}"
          echo
