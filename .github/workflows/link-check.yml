name: Check links

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '13 6 * * 0'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --root-dir "${{ github.workspace }}" --include-fragments '**/*.md' --github-token ${{ secrets.GITHUB_TOKEN }}
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
