name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Each PR gets its own Preview URL (public) under the same Worker.
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: npx wrangler preview --name "pr-${{ github.event.number }}" --message "${{ github.sha }}"

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npx wrangler preview delete --name "pr-${{ github.event.number }}" --skip-confirmation
