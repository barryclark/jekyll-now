name: Markdown link check

on:
    push:
    workflow_dispatch:
    schedule:
        - cron: '16 2 * * 0'  # [https://crontab.guru/#16_2_*_*_0](At 02:16 on Sunday)

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: tcort/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
